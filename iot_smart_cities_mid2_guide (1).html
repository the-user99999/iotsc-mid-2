<p>Cyber threats targeting IoT-based medical devices exploit vulnerabilities across attack vectors to compromise device integrity, user privacy, or patient safety:</p>

<ol>
  <li><strong>Malware Attacks:</strong> Infiltration via malicious software such as Viruses, Rootkits, Trojans, and Worms to hijack device operations.</li>

<div class="unit-heading">Unit III: Part-B — Medical IoT Cybersecurity</div>
<div class="unit-sub">4-Mark Question</div>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Unit-III, Question 1 · 4M · CO-3 · BL-1</div>
  <div class="q-title">Explain cybersecurity threats to IoT medical devices.</div>
  <div class="q-marks">4M</div>
</div>

<p>Cybersecurity threats on medical IoT devices compromise patient safety, data privacy, and device availability. These threats are categorized into <strong>Attack Vectors</strong>, <strong>Post-Compromise Actions</strong>, and <strong>Impacts</strong>:</p>

<h2>1. Attack Vectors (How devices are compromised)</h2>
<ul>
  <li><strong>Malware:</strong> Malicious code such as <strong>Viruses</strong> (blocking execution), <strong>Rootkits</strong> (gaining hidden administrator/root privileges), <strong>Trojans</strong> (disguised as updates), and <strong>Worms</strong> (spreading across networks).</li>
  <li><strong>Software/Firmware Vulnerabilities:</strong> Exploiting unauthenticated firmware updates or known software bugs (e.g., pacemaker or infusion pump vulnerabilities allowing remote manipulation).</li>
  <li><strong>Wireless Connectivity:</strong> Infiltrating insecure radio frequency channels to adjust settings or inject commands without physical contact.</li>
</ul>

<h2>2. Post-Compromise Actions (What attackers do after access)</h2>
<ul>
  <li><strong>Denial of Control / DoS:</strong> Disrupting operations by blocking information flow or depleting battery/memory resources.</li>
  <li><strong>Device &amp; Configuration Manipulation:</strong> Maliciously modifying software settings, alarm thresholds, or exploiting privilege escalation.</li>
  <li><strong>Spoofed Information &amp; Replay Attacks:</strong> Sending false telemetry data or replaying old intercepted messages to impersonate legitimate devices.</li>
</ul>

<h2>3. Impact on Patients</h2>
<ul>
  <li><strong>Patient Health &amp; Adverse Events:</strong> Causing cardiac failure, tachycardia/bradycardia, inappropriate drug dosage (e.g., insulin pumps), or hearing loss from cochlear implants.</li>
  <li><strong>Privacy Compromise:</strong> Eavesdropping on transmission to expose sensitive medical records or implant serial numbers.</li>
  <li><strong>Physical Destruction:</strong> Damaging medical hardware through unauthorized software commands.</li>
</ul>

          content: `
<div class="q-block">
<div class="q-header">
  <div class="q-num">Unit-III, Question 2 · 4M · CO-3 · BL-2</div>
  <div class="q-title">Illustrate countermeasures used to protect IoT-based medical devices against cybersecurity threats.</div>
  <div class="q-marks">4M</div>
</div>

<p>To secure medical IoT devices and address core security objectives, specific countermeasures are implemented across different layers:</p>

<h2>1. Ensuring Confidentiality and Integrity</h2>
<ul>
  <li><strong>Data Encryption:</strong> Uses symmetric key ciphers (block and stream ciphers) to protect transmitted data from eavesdropping, as resource-constrained medical devices cannot support heavy public-key cryptography.</li>
  <li><strong>Integrity Mechanisms:</strong> Utilizes message authentication codes, one-way hash functions, and digital signatures to prevent unauthorized data tampering or code injection.</li>
</ul>

<h2>2. Ensuring Availability</h2>
<ul>
  <li><strong>Resource Depletion &amp; Jamming Defense:</strong> Uses pattern/behavior analysis and alarm notification systems to alert users of active jamming or flooding attacks that drain battery or memory.</li>
</ul>

<h2>3. Ensuring Authentication and Authorization</h2>
<ul>
  <li><strong>Entity &amp; Origin Authentication:</strong> Verifies the claimed identity of entities (patients, doctors, servers) and validates the origin of transmitted data.</li>
  <li><strong>Access Control Lists (ACLs):</strong> Restricts device reprogramming or therapy parameter updates (e.g., voltage and thresholds) strictly to authorized medical personnel (doctors and technicians).</li>
</ul>

<h2>4. Ensuring Nonrepudiation</h2>
<ul>
  <li><strong>Secure Access Logs (Auditing):</strong> Maintains secure, tamper-proof audit logs recording all operations performed by or on the device to prevent entities from denying past actions.</li>
</ul>

let currentUnit = 0;
let currentSection = 0;
let readSections = new Set();

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  courseData.units.forEach((unit, ui) => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn' + (ui === currentUnit ? ' active' : '');
    btn.innerHTML = unit.title + '<span class="ch">▸</span>';
    btn.onclick = () => { currentUnit = ui; currentSection = 0; renderSidebar(); renderContent(); };
    nav.appendChild(btn);
    const list = document.createElement('div');
    list.className = 'sec-list' + (ui === currentUnit ? ' open' : '');
    unit.sections.forEach((sec, si) => {
      const link = document.createElement('a');
      link.className = 'sec-link' + (ui === currentUnit && si === currentSection ? ' active' : '');
      link.textContent = sec.title;
      link.onclick = (e) => { e.preventDefault(); currentUnit = ui; currentSection = si; renderSidebar(); renderContent(); };
      list.appendChild(link);
    });
    nav.appendChild(list);
  });
}

function renderContent() {
  const area = document.getElementById('contentArea');
  const unit = courseData.units[currentUnit];
  const sec = unit.sections[currentSection];
  let html = sec.content;
  const prevDisabled = currentUnit === 0 && currentSection === 0;
  const nextDisabled = currentUnit === courseData.units.length - 1 && currentSection === unit.sections.length - 1;
  let prevTarget = null, nextTarget = null;
  if (!prevDisabled) {
    if (currentSection > 0) prevTarget = [currentUnit, currentSection - 1];
    else prevTarget = [currentUnit - 1, courseData.units[currentUnit - 1].sections.length - 1];
  }
  if (!nextDisabled) {
    if (currentSection < unit.sections.length - 1) nextTarget = [currentUnit, currentSection + 1];
    else nextTarget = [currentUnit + 1, 0];
  }
  html += '<div class="top-nav">';
  html += '<button class="nav-btn" ' + (prevDisabled ? 'disabled' : '') + ' onclick="' + (prevTarget ? 'jumpTo(' + prevTarget[0] + ',' + prevTarget[1] + ')' : '') + '">← Previous</button>';
  html += '<span style="font-size:13px; color:var(--text-tertiary);">' + (currentSection + 1) + ' of ' + unit.sections.length + '</span>';
  html += '<button class="nav-btn" ' + (nextDisabled ? 'disabled' : '') + ' onclick="' + (nextTarget ? 'jumpTo(' + nextTarget[0] + ',' + nextTarget[1] + ')' : '') + '">Next →</button>';
  html += '</div>';
  if (currentSection === unit.sections.length - 1 && flashcardData[currentUnit]) {
    html += '<h2 style="margin-top:40px; font-size:20px;">Quick Review Flashcards</h2>';
    html += '<p style="font-size:13px; color:var(--text-tertiary); margin-bottom:16px;">Click cards to reveal answers</p>';
    flashcardData[currentUnit].forEach(function(card) {
      html += '<div class="flashcard" onclick="this.classList.toggle(\'flipped\')"><div class="fc-q">' + card.q + '</div><div class="fc-a">' + card.a + '</div><div class="fc-hint">Click to flip</div></div>';
    });
  }
  area.innerHTML = html;
  readSections.add(sec.id);
  updateProgress();
  window.scrollTo(0, 0);
}

function updateProgress() {
  const total = courseData.units.reduce(function(a, u) { return a + u.sections.length; }, 0);
  const pct = Math.round((readSections.size / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% complete';
}

function jumpTo(ui, si) {
  currentUnit = ui; currentSection = si;
  renderSidebar(); renderContent();
}

function setupSearch() {
  const box = document.getElementById('searchBox');
  const res = document.getElementById('searchResults');
  box.addEventListener('input', function(e) {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { res.style.display = 'none'; return; }
    const matches = [];
    courseData.units.forEach(function(u, ui) {
      u.sections.forEach(function(s, si) {
        const text = (s.title + ' ' + s.content.replace(/<[^>]+>/g, ' ')).toLowerCase();
        if (text.includes(q)) {
          const rawText = s.content.replace(/<[^>]+>/g, ' ');
          const idx = text.indexOf(q);
          const snippet = rawText.substring(Math.max(0, idx - 30), idx + 60);
          matches.push({ui: ui, si: si, title: s.title, snippet: '...' + snippet + '...'});
        }
      });
    });
    if (!matches.length) { res.innerHTML = '<div class="search-result"><span style="color:var(--text-tertiary)">No results</span></div>'; }
    else {
      res.innerHTML = matches.map(function(m) {
        return '<div class="search-result" onclick="jumpTo(' + m.ui + ',' + m.si + '); document.getElementById(\'searchResults\').style.display=\'none\'; document.getElementById(\'searchBox\').value=\'\';"><div class="sr-title">' + m.title + '</div><div class="sr-snippet">' + m.snippet + '</div></div>';
      }).join('');
    }
    res.style.display = 'block';
  });
  document.addEventListener('click', function(e) {
    if (!box.contains(e.target) && !res.contains(e.target)) res.style.display = 'none';
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

renderSidebar();
renderContent();
setupSearch();
</script>
